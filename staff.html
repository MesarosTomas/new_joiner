<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syntax · Onboarding Staff</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  color-scheme: light;
  --navy:#0D2480;
  --navy-ink:#0A1B4D;
  --cyan:#00AEEF;
  --cyan-soft:#E8F6FD;
  --green:#5BAE3E;
  --green-soft:#EAF6E5;
  --ink:#1D2733;
  --ink-soft:#5B6B7C;
  --paper:#F5F6F8;
  --card:#FFFFFF;
  --line:#E4E8ED;
  --amber:#9C6A1E;
  --amber-soft:#FBF1DD;
  --slate:#8A94A0;
  --slate-soft:#EEF0F3;
  --coral:#B3402E;
  --coral-soft:#FBE7E2;
  --radius:10px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --navy:#13297A;
  --navy-ink:#EAF1FF;
  --cyan:#3FC4FF;
  --cyan-soft:rgba(63,196,255,.16);
  --green:#7BCB5E;
  --green-soft:rgba(123,203,94,.16);
  --ink:#E8ECF4;
  --ink-soft:#9AA6BC;
  --paper:#0B1220;
  --card:#131D30;
  --line:#25324A;
  --amber:#D9AE4E;
  --amber-soft:rgba(217,174,78,.16);
  --slate:#7C879C;
  --slate-soft:rgba(124,135,156,.18);
  --coral:#E17B65;
  --coral-soft:rgba(225,123,101,.18);
}
body{transition:background .2s ease, color .2s ease;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Inter',sans-serif;}

#app{max-width:900px;margin:0 auto;padding:32px 20px 80px;}

.wordmark{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line);
}
.wordmark .brand{
  display:flex;align-items:center;gap:12px;
}
.wordmark .brand img{height:26px;width:auto;display:block;}
.wordmark .brand .divider{display:none;}
.wordmark .brand .label{
  font-family:'Inter',sans-serif;font-weight:600;
  font-size:12.5px;letter-spacing:.01em;text-transform:none;
  color:var(--navy);background:var(--card);border:1.5px solid var(--cyan);
  border-radius:20px;padding:4px 12px;
}
.wordmark .reset-link{
  font-size:12px;color:var(--ink-soft);background:none;border:none;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  font-family:'Inter',sans-serif;
}
.wordmark .reset-link:hover{color:var(--coral);}

.menu-wrap{position:relative;}
.menu-trigger{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.menu-trigger:hover{border-color:var(--cyan);color:var(--navy);}
.menu-dropdown{
  display:none;position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 6px 18px rgba(13,36,128,.14);padding:12px;min-width:220px;z-index:20;
}
.menu-dropdown.open{display:block;}
.menu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);}
.menu-row span{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.theme-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.theme-toggle button{
  padding:5px 9px;background:var(--card);border:none;cursor:pointer;font-size:11.5px;color:var(--ink-soft);
  border-right:1px solid var(--line);
}
.theme-toggle button:last-child{border-right:none;}
.theme-toggle button.active{background:var(--navy);color:#fff;font-weight:600;}
.menu-action{
  width:100%;text-align:left;padding:8px 10px;background:transparent;border:1px solid var(--line);border-radius:8px;
  font-size:12.5px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;
}
.menu-action:hover{border-color:var(--cyan);}

.lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.lang-toggle button{
  padding:5px 9px;background:var(--card);border:none;cursor:pointer;font-size:14px;
  border-right:1px solid var(--line);
}
.lang-toggle button:last-child{border-right:none;}
.lang-toggle button.active{background:var(--cyan-soft);}

.page-loader{
  position:fixed;inset:0;background:var(--paper);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .25s ease;
}
.page-loader.hidden{opacity:0;pointer-events:none;}
.page-loader-spinner{
  width:34px;height:34px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--navy);animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.guide-overlay{
  position:fixed;inset:0;background:rgba(15,27,51,.55);z-index:9998;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.guide-panel{
  background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:85vh;
  overflow-y:auto;position:relative;box-shadow:0 12px 40px rgba(13,36,128,.25);
}
.guide-close{
  position:absolute;top:14px;right:14px;background:var(--slate-soft);border:none;border-radius:50%;
  width:28px;height:28px;cursor:pointer;color:var(--ink-soft);font-size:13px;z-index:2;
}
.guide-close:hover{background:var(--coral-soft);color:var(--coral);}
.guide-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 20px;position:sticky;top:0;
  background:var(--card);border-radius:14px 14px 0 0;
}
.guide-tabs button{
  flex:1;padding:16px 8px 12px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;
  color:var(--ink-soft);border-bottom:2px solid transparent;font-family:'Inter',sans-serif;
}
.guide-tabs button.active{color:var(--navy);border-bottom-color:var(--navy);}
#guide-body{padding:24px 28px 28px;}
.guide-title{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;color:var(--navy-ink);margin-bottom:6px;}
.guide-sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;}
.guide-step{display:flex;gap:12px;margin-bottom:16px;}
.guide-step-num{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--cyan-soft);color:var(--navy);
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.guide-step-text{font-size:13.5px;line-height:1.5;color:var(--ink);padding-top:2px;}
.guide-copy-btn{
  width:100%;margin-top:8px;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;
  font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
}
.guide-copy-btn:hover{background:#0a1c66;}
.guide-copied{color:var(--green);font-size:12.5px;text-align:center;margin-top:8px;display:none;}

.congrats-banner{
  background:linear-gradient(135deg,var(--green),#3f8f2c);color:#fff;border-radius:12px;
  padding:22px 26px;margin-bottom:20px;text-align:center;
}
.congrats-banner .emoji{font-size:32px;margin-bottom:6px;}
.congrats-banner h3{font-size:18px;margin:0 0 4px;}
.congrats-banner p{font-size:13px;margin:0;opacity:.92;}
.congrats-banner button{
  margin-top:14px;padding:9px 18px;background:#fff;color:var(--green);border:none;border-radius:8px;
  font-weight:600;font-size:13px;cursor:pointer;
}

.feedback-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px;}
.feedback-box textarea{
  width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);background:var(--card);resize:vertical;margin-bottom:10px;
}
.feedback-thanks{color:var(--green);font-size:13px;font-weight:600;}

.admin-section{margin-bottom:24px;}
.admin-section h3{font-size:14px;margin:0 0 10px;color:var(--navy-ink);}
.audit-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline;flex-wrap:wrap;}
.audit-row:last-child{border-bottom:none;}
.audit-time{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:10.5px;flex:0 0 auto;}
.audit-text{flex:1 1 200px;}
.feedback-row{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.feedback-row:last-child{border-bottom:none;}
.feedback-row .who{font-weight:600;color:var(--navy-ink);}
.feedback-row .msg{margin-top:3px;color:var(--ink);}
.template-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.template-row input, .template-row select{
  padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--card);color:var(--ink);
}
.template-row input[type=text]{flex:1;min-width:140px;}

.setup-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:32px 34px 28px;
  margin-bottom:22px;
  box-shadow:0 1px 2px rgba(13,36,128,.05);
}
.setup-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:10px;font-weight:600;
}
.setup-card h1{
  font-family:'Inter',sans-serif;font-size:25px;font-weight:600;
  margin:0 0 8px;line-height:1.25;color:var(--navy-ink);
}
.setup-card p.sub{
  color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 0 24px;max-width:560px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
}
.field input[type=text],
.field input[type=date],
.field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  background:var(--card);
}
.field input:focus,.field select:focus{outline:2px solid var(--cyan);outline-offset:1px;}
.segmented{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.segmented button{
  flex:1;padding:10px 10px;background:var(--card);border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink-soft);
  border-right:1px solid var(--line);
}
.segmented button:last-child{border-right:none;}
.segmented button.active{background:var(--cyan);color:#fff;font-weight:600;}
.field-inline{display:none;margin-top:8px;}
.field-inline.show{display:block;}

.resume-wrap{text-align:center;margin-bottom:22px;}
.resume-link{
  background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;font-family:'Inter',sans-serif;
}
.resume-link:hover{color:var(--navy);}
.resume-box{
  max-width:420px;margin:12px auto 0;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:16px;text-align:left;
}
.resume-box input{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;
  margin-bottom:10px;background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
}
.resume-submit{
  width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
}
.resume-submit:hover{background:var(--cyan);}
.resume-submit:disabled{background:var(--slate);cursor:not-allowed;}
.resume-error{color:var(--coral);font-size:12px;margin-top:8px;}
.cta{
  padding:11px 22px;background:var(--navy);color:#fff;border:1px solid var(--navy);
  border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:6px;letter-spacing:normal;text-transform:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .12s ease, color .12s ease, box-shadow .12s ease;
  box-shadow:0 1px 2px rgba(13,36,128,.12);
}
.cta:hover{background:#0a1c66;border-color:#0a1c66;}
.cta:disabled{background:var(--slate);border-color:var(--slate);cursor:not-allowed;box-shadow:none;}

.summary-bar{
  background:var(--navy);
  color:#fff;border-radius:12px;
  padding:22px 30px;margin-bottom:22px;
  box-shadow:0 2px 8px rgba(13,36,128,.18);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;
}
.summary-bar .corner{display:none;}
.summary-bar .who h2{
  font-family:'Inter',sans-serif;font-size:19px;margin:0 0 5px;font-weight:600;
}
.summary-bar .who .meta{
  font-size:12.5px;color:#B9C6EE;display:flex;gap:14px;flex-wrap:wrap;
}
.summary-bar .who .meta span b{color:#fff;font-weight:600;}
.summary-bar .pct{text-align:right;}
.summary-bar .pct .num{
  font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--cyan);
}
.summary-bar .pct .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AAAD8;margin-top:2px;}

.progress-track{
  width:100%;height:8px;border-radius:8px;background:rgba(255,255,255,.16);
  overflow:hidden;margin-top:18px;
}
.progress-fill{
  height:100%;border-radius:8px;
  background:linear-gradient(90deg, var(--cyan), var(--green));
  transition:width .5s ease;
}

.role-toggle-bar{display:flex;gap:8px;margin-bottom:22px;}
.role-toggle-bar button{
  flex:1;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
}
.role-toggle-bar button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.staff-link-wrap{text-align:right;margin-bottom:18px;}
.staff-link{
  font-size:12.5px;color:var(--ink-soft);text-decoration:none;padding:7px 12px;border:1px solid var(--line);
  border-radius:20px;background:var(--card);transition:border-color .15s ease, color .15s ease;
}
.staff-link:hover{border-color:var(--cyan);color:var(--navy);}

.mgr-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:32px 34px;margin-bottom:22px;box-shadow:0 1px 2px rgba(13,36,128,.05);}
.admin-link-wrap{text-align:center;}
.buddy-recent-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;margin-bottom:8px;
}
.buddy-recent-main{flex:1;}
.buddy-recent-name{font-weight:600;font-size:13px;color:var(--ink);}
.buddy-recent-pos{font-size:11.5px;color:var(--ink-soft);}
.buddy-recent-open{
  padding:6px 12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:12px;
  font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.buddy-recent-open:hover{background:#0a1c66;}
.buddy-recent-remove{
  background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:4px 6px;
}
.buddy-recent-remove:hover{color:var(--coral);}
.admin-link{
  background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;font-family:'Inter',sans-serif;
}
.admin-link:hover{color:var(--navy);}
.mgr-card h1{font-family:'Inter',sans-serif;font-size:22px;margin:0 0 8px;color:var(--navy-ink);}
.mgr-card p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;line-height:1.5;}
.code-boxes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.mgr-code-box{background:var(--cyan-soft);border:1px dashed var(--cyan);border-radius:8px;padding:12px 16px;margin-top:0;}
.mgr-code-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);font-weight:600;margin-bottom:4px;}
.mgr-code-box .code{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--navy-ink);letter-spacing:.06em;}
.mgr-code-box .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}
.code-box-private{background:var(--coral-soft);border-color:var(--coral);}
.code-box-private .lbl{color:var(--coral);}
@media(max-width:640px){.code-boxes-grid{grid-template-columns:1fr;}}
.mgr-error{color:var(--coral);font-size:12.5px;margin-top:10px;display:none;}

.pin-box{
  background:var(--cyan-soft);border:1.5px dashed var(--cyan);border-radius:var(--radius);
  padding:24px 26px;margin-top:16px;text-align:center;
}
.pin-box-icon{
  width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--navy);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:17px;
  box-shadow:0 1px 3px rgba(13,36,128,.12);
}
.pin-box-title{font-family:'Inter',sans-serif;font-weight:600;font-size:16px;color:var(--navy-ink);margin-bottom:6px;}
.pin-box-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5;max-width:340px;margin:0 auto 18px;}
.pin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;text-align:left;}
.pin-label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
.pin-input{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.4em;text-align:center;margin-bottom:16px;
}
.pin-input:focus{outline:2px solid var(--cyan);outline-offset:1px;}
.pin-box .cta{max-width:280px;margin:0 auto;}
.pin-box .mgr-error{text-align:center;}
.mgr-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.mgr-chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
.mgr-chart-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:14px;}
.mgr-chart-bars{display:flex;align-items:flex-end;gap:12px;height:110px;}
.mgr-chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.mgr-chart-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:4px;min-height:14px;}
.mgr-chart-bar{width:100%;max-width:34px;border-radius:8px 5px 0 0;background:linear-gradient(180deg,var(--cyan),var(--navy));transition:height .3s ease;}
.mgr-chart-label{font-size:10.5px;color:var(--ink-soft);margin-top:6px;}
.mgr-list-controls{display:flex;gap:10px;margin-bottom:14px;}
.mgr-list-controls input, .mgr-list-controls select{
  padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--card);color:var(--ink);
  font-family:'Inter',sans-serif;
}
.mgr-list-controls input{flex:1;}
.compare-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.compare-name{flex:0 0 110px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.compare-track{flex:1;height:8px;border-radius:8px;background:var(--slate-soft);overflow:hidden;}
.compare-fill{height:100%;border-radius:8px;transition:width .3s ease;}
.compare-pct{flex:0 0 38px;text-align:right;font-size:11px;color:var(--ink-soft);}
.mgr-target-days{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cyan-soft);border-radius:8px;
  padding:10px 14px;margin-bottom:16px;
}
.mgr-target-label{font-size:12px;font-weight:600;color:var(--navy-ink);}
.mgr-target-days select{
  padding:6px 10px;border:1px solid var(--cyan);border-radius:8px;font-size:12.5px;background:var(--card);color:var(--ink);
  font-family:'Inter',sans-serif;
}
.mgr-target-hint{font-size:11px;color:var(--ink-soft);}
.pin-reminder{
  display:flex;align-items:center;gap:10px;background:var(--cyan-soft);border:1px dashed var(--cyan);
  border-radius:8px;padding:9px 14px;margin-bottom:16px;font-size:12.5px;color:var(--navy-ink);
}
.pin-reminder .pin-value{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.08em;}
.pin-reveal-btn{
  margin-left:auto;background:none;border:1px solid var(--navy);color:var(--navy);border-radius:8px;
  padding:3px 10px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;
}
.mgr-stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.mgr-stat .num{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;color:var(--navy-ink);}
.mgr-stat .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.mgr-row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mgr-row .name{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;flex:1 1 160px;}
.mgr-row .meta{font-size:11.5px;color:var(--ink-soft);flex:1 1 100%;margin-top:2px;}
.mgr-row .bar-wrap{flex:1 1 160px;}
.mgr-row .bar-track{width:100%;height:6px;border-radius:8px;background:var(--slate-soft);overflow:hidden;}
.mgr-row .bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--cyan),var(--green));}
.mgr-row .pct-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:3px;}
.mgr-back{font-size:12.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;}
.mgr-detail-inner{background:var(--paper);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:16px 18px;margin-top:-11px;margin-bottom:10px;}

.assigned-cat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.assigned-cat-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--paper);}
.assigned-cat-title{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--navy-ink);flex:1;}
.assigned-cat-count{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);
  background:var(--slate-soft);border-radius:20px;padding:2px 8px;
}
.assigned-cat-chev{color:var(--ink-soft);font-size:11px;transition:transform .15s ease;}
.assigned-cat-body{padding:4px 14px 8px;}
.assigned-task-row{
  display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
}
.assigned-task-row:last-child{border-bottom:none;}
.assigned-task-check{flex:0 0 auto;font-size:14px;padding-top:1px;}
.assigned-task-main{flex:1;min-width:0;}
.assigned-task-text{font-size:13px;color:var(--ink);line-height:1.4;}
.assigned-task-text.done{color:var(--slate);text-decoration:line-through;}
.assigned-task-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.assigned-task-note{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin-top:3px;}
.assigned-task-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.tag-done-date{
  font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;
  background:var(--green-soft);color:var(--green);
}
.assigned-task-delete{
  flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;
  color:var(--ink-soft);cursor:pointer;font-size:11px;line-height:1;
}
.assigned-task-delete:hover{border-color:var(--coral);color:var(--coral);}
.mgr-section-label{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;
  margin:16px 0 8px;
}
.mgr-section-label.rec-label{color:var(--navy);}
.mgr-empty-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;padding:6px 0 4px;}
.rec-wrap{}
.rec-toolbar{display:flex;gap:8px;margin:8px 0 10px;}
.rec-search{
  flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;
  background:var(--card);color:var(--ink);font-family:'Inter',sans-serif;
}
.rec-quickadd{
  padding:8px 14px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:12px;
  font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
}
.rec-quickadd:hover{background:#0a1c66;}
.rec-quickadd:disabled{background:var(--slate);cursor:not-allowed;}
.rec-cat-card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;}
.rec-cat-card.rec-cat-featured{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-soft) inset;}
.rec-cat-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;}
.rec-cat-star{color:var(--cyan);font-size:13px;}
.rec-cat-title{font-weight:600;font-size:12.5px;color:var(--navy-ink);flex:1;}
.rec-cat-count{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);
  background:var(--slate-soft);border-radius:20px;padding:2px 8px;
}
.rec-cat-addall{
  padding:4px 10px;background:var(--cyan-soft);color:var(--navy);border:none;border-radius:20px;
  font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
}
.rec-cat-addall:hover{background:var(--cyan);color:#fff;}
.rec-cat-addall:disabled{background:var(--slate-soft);color:var(--slate);cursor:not-allowed;}
.rec-cat-chev{color:var(--ink-soft);font-size:11px;transition:transform .15s ease;}
.rec-cat-body{padding:0 12px 8px;border-top:1px solid var(--line);}
.rec-task{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.rec-task:last-child{border-bottom:none;}
.rec-task-main{flex:1 1 200px;min-width:150px;}
.rec-task-text{font-size:12.5px;color:var(--ink);}
.rec-task-desc{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.rec-task-day{
  padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;background:var(--card);color:var(--ink);
  flex:0 0 auto;
}
.rec-task-add{
  padding:5px 12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:11.5px;
  font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;flex:0 0 auto;white-space:nowrap;
}
.rec-task-add:hover{background:var(--cyan);}
.rec-task-add:disabled{background:var(--slate);cursor:not-allowed;}
.mgr-remove-btn{margin-top:8px;padding:7px 12px;background:transparent;border:1px solid var(--coral);color:var(--coral);border-radius:8px;font-size:12px;cursor:pointer;}
.mgr-remove-confirm{font-size:12px;color:var(--coral);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.mgr-remove-yes{background:var(--coral);color:#fff;border:none;border-radius:8px;padding:4px 9px;font-size:11.5px;cursor:pointer;}
.mgr-remove-no{background:transparent;border:1px solid var(--coral);color:var(--coral);border-radius:8px;padding:4px 9px;font-size:11.5px;cursor:pointer;}
.mgr-add-task-btn{
  margin-top:6px;margin-right:8px;padding:7px 12px;background:transparent;border:1px solid var(--cyan);color:var(--navy);
  border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;
}
.mgr-add-task-form{
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;margin-bottom:10px;
}
.mgr-add-task-form input[type=text],
.mgr-add-task-form textarea,
.mgr-add-task-form select{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;
  font-family:'Inter',sans-serif;margin-bottom:8px;background:var(--card);color:var(--ink);
}
.mgr-add-task-form textarea{min-height:50px;resize:vertical;}
.mgr-newtask-row{display:flex;gap:8px;align-items:center;}
.mgr-newtask-row select{margin-bottom:0;flex:1;}
.mgr-newtask-row button{
  padding:8px 14px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:12.5px;
  font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
}
.mgr-newtask-row button:hover{background:var(--cyan);}
.mgr-newtask-row button:disabled{background:var(--slate);cursor:not-allowed;}
.section-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin:8px 0 12px;font-weight:600;
}

.locked-zone{
  background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:50px 30px;text-align:center;color:var(--ink-soft);
}
.locked-zone .lock-icon{
  width:36px;height:36px;border-radius:50%;background:var(--cyan-soft);color:var(--navy);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:16px;
}
.locked-zone .lock-title{
  font-family:'Inter',sans-serif;font-weight:600;font-size:15px;color:var(--navy-ink);margin-bottom:6px;
}
.locked-zone .lock-sub{font-size:13px;line-height:1.5;max-width:380px;margin:0 auto;}
.locked-preview{
  display:flex;gap:8px;justify-content:center;margin-top:26px;opacity:.45;flex-wrap:wrap;
}
.locked-preview .ghost{
  width:64px;height:34px;border-radius:8px;background:var(--slate-soft);
}

.tour-btn{
  display:block;width:100%;max-width:280px;margin:16px auto 20px;padding:12px;
  background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;
  cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 2px 6px rgba(13,36,128,.18);
}
.tour-btn:hover{background:#0a1c66;}

.quick-links-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:20px;
}
.quick-links-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
.quick-links-title{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;color:var(--navy-ink);margin-bottom:2px;}
.quick-links-sub{font-size:12.5px;color:var(--ink-soft);}
.tour-link-small{
  flex:0 0 auto;padding:7px 14px;background:var(--cyan-soft);color:var(--navy);border:none;border-radius:20px;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
}
.tour-link-small:hover{background:var(--cyan);color:#fff;}
.quick-links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.quick-link-box{
  display:block;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px 12px;text-decoration:none;transition:border-color .15s ease, transform .15s ease;
}
.quick-link-box:hover{border-color:var(--cyan);transform:translateY(-2px);}
.quick-link-icon{height:24px;margin-bottom:8px;display:flex;align-items:center;}
.quick-link-icon img{height:22px;width:auto;max-width:32px;object-fit:contain;}
.quick-link-icon-fallback{font-size:20px;}
.quick-link-name{font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;color:var(--ink);margin-bottom:3px;}
.quick-link-desc{font-size:10.5px;color:var(--ink-soft);line-height:1.35;}
@media(max-width:640px){.quick-links-grid{grid-template-columns:repeat(2,1fr);}}

.routing-strip{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:26px;
}
.routing-strip .strip-title{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  margin-bottom:14px;font-weight:600;
}
.strip-row{display:flex;align-items:center;overflow-x:auto;padding-bottom:6px;}
.strip-op{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  width:74px;cursor:pointer;
}
.strip-op .dot{
  width:15px;height:15px;border-radius:50%;border:2px solid var(--slate);background:var(--card);
  margin-bottom:6px;
}
.strip-op.status-done .dot{background:var(--green);border-color:var(--green);}
.strip-op.status-progress .dot{background:var(--amber);border-color:var(--amber);}
.strip-op.status-attention .dot{background:var(--coral);border-color:var(--coral);}
.strip-op .num{font-size:10px;color:var(--ink-soft);}
.strip-line{
  flex:1 1 auto;height:2px;background:var(--line);min-width:14px;
}

.op-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:14px;overflow:hidden;
}
.op-head{
  display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;
}
.op-head .op-num{
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;color:var(--navy);
  background:var(--cyan-soft);border:none;border-radius:20px;min-width:26px;height:22px;padding:0 9px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.op-head .op-title{
  font-family:'Inter',sans-serif;font-weight:600;font-size:15.5px;flex:1 1 auto;
}
.cat-link-btn{
  flex:0 0 auto;font-size:11px;font-weight:600;color:var(--navy);background:var(--cyan-soft);
  border-radius:20px;padding:4px 10px;text-decoration:none;white-space:nowrap;
}
.cat-link-btn:hover{background:var(--cyan);color:#fff;}
.op-head .op-owner{
  font-size:12px;color:var(--ink-soft);flex:0 0 auto;display:none;
}
.op-head .op-badge{
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;flex:0 0 auto;
}
.badge-done{background:var(--green-soft);color:var(--green);}
.badge-progress{background:var(--amber-soft);color:var(--amber);}
.badge-none{background:var(--slate-soft);color:var(--slate);}
.op-head .op-count{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:0 0 auto;
}
.op-head .chev{
  transition:transform .15s ease;color:var(--ink-soft);flex:0 0 auto;
}
.op-card.collapsed .chev{transform:rotate(-90deg);}
.op-body{border-top:1px solid var(--line);}
.op-card.collapsed .op-body{display:none;}
.task-row{
  display:flex;align-items:flex-start;gap:12px;padding:12px 20px;
  border-bottom:1px solid #F0F2F0;
}
.task-row:last-child{border-bottom:none;}
.task-row input[type=checkbox]{
  margin-top:2px;width:17px;height:17px;accent-color:var(--navy);cursor:pointer;flex:0 0 auto;
}
.task-main{flex:1 1 auto;min-width:0;}
.task-text{font-size:14px;line-height:1.4;}
.task-text.done{color:var(--slate);text-decoration:line-through;}
.task-desc{font-size:12px;line-height:1.45;color:var(--ink-soft);margin-top:3px;}
.task-tags{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;}
.tag-day{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:8px;
  background:var(--slate-soft);color:var(--ink-soft);
}
.tag-day.attention{background:var(--coral-soft);color:var(--coral);}
.tag-role{
  font-size:10.5px;padding:2px 7px;border-radius:8px;background:var(--cyan-soft);color:var(--navy);
}
.task-note{
  width:100%;margin-top:8px;padding:6px 9px;font-size:12.5px;border:1px solid var(--line);
  border-radius:8px;font-family:'Inter',sans-serif;resize:vertical;min-height:30px;
  background:var(--paper);color:var(--ink);
}
.task-note::placeholder{color:var(--ink-soft);opacity:.8;}
.task-note:focus{outline:2px solid var(--cyan);outline-offset:1px;}
.footer-note{
  text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:30px;line-height:1.6;
}
.footer-note b{color:var(--ink);}
@media(max-width:640px){
  .grid2{grid-template-columns:1fr;}
  .op-head .op-owner{display:none !important;}
  .summary-bar{flex-direction:column;align-items:flex-start;}
}
</style>
</head>

function t(key){
  return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key;
}

function applyStaticTranslations(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
}

/* Resolves the best link for a category: a custom URL attached to one of
   its tasks (set by whoever assigned it) wins over the standard system link. */
function getCategoryLink(catId, tasksInCat){
  const customUrl = (tasksInCat||[]).map(t=>t.url).find(Boolean);
  if(customUrl) return { url: customUrl, icon: "🔗", slug: null };
  return LINKS_BY_CATID[catId] || null;
}

      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = await res.json();
    if(!res.ok || !rows.length){
      errEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = t("resume_button");
      return;
    }
    const r = rows[0];
    state = {
      id: r.id, name: r.name, position: r.position, manager: r.manager,
      country: r.country, startDate: r.start_date, accessCode: r.access_code, buddyCode: r.buddy_code,
      tasks: r.tasks || {}, notes: r.notes || {}, customTasks: r.custom_tasks || [],
      targetDays: r.target_days || 10, completedDates: r.completed_dates || {}
    };
    await kvSet(STORAGE_KEY, JSON.stringify(state));
    renderAll();
    document.getElementById("dashboard-zone").scrollIntoView({behavior:"smooth", block:"start"});
  }catch(e){
    errEl.textContent = "Something went wrong reaching the database. Try again.";
    errEl.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = t("resume_button");
  }
}

async function syncProfileToCloud(){
  if(!cloudConfigured() || !state) return;
  try{
    const idx = buildTasks(state);
    const total = idx.length;
    const done = idx.filter(t=>state.tasks[t.tid]).length;
    const payload = {
      id: state.id,
      name: state.name,
      position: state.position,
      manager: state.manager,
      country: state.country,
      start_date: state.startDate,
      access_code: state.accessCode,
      buddy_code: state.buddyCode,
      total_tasks: total,
      done_tasks: done,
      pct: total ? Math.round((done/total)*100) : 0,
      tasks: state.tasks,
      notes: state.notes,
      completed_dates: state.completedDates || {},
      custom_tasks: state.customTasks || [],
      target_days: state.targetDays || 10,
      updated_at: new Date().toISOString()
    };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Prefer": "resolution=merge-duplicates"
      },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const errText = await res.text();
      console.error("Cloud sync failed ("+res.status+"): "+errText+" — check that all Supabase SQL setup steps have been run (columns must match the payload).");
    }
  }catch(e){ console.error("cloud sync failed", e); }
}

/* Works inside Claude.ai artifacts (window.storage) AND on a standalone
   deployment like Vercel (falls back to localStorage there automatically). */
async function kvGet(key){
  if(typeof window.storage !== "undefined"){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function kvSet(key, value){
  if(typeof window.storage !== "undefined"){
    try{ await window.storage.set(key, value, false); return; }catch(e){}
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function kvDelete(key){
  if(typeof window.storage !== "undefined"){
    try{ await window.storage.delete(key, false); return; }catch(e){}
  }
  try{ localStorage.removeItem(key); }catch(e){}
}

async function loadState(){
  const v = await kvGet(STORAGE_KEY);
  return v ? JSON.parse(v) : null;
}
async function saveState(){
  await kvSet(STORAGE_KEY, JSON.stringify(state));
  await syncProfileToCloud();
}
async function clearState(){
  await kvDelete(STORAGE_KEY);
  state = null;
}

function getActiveCategories(profile){
  const p = profile || state;
  if(p && p.country && p.country !== "Slovakia"){
    return CATEGORIES.filter(c => c.id !== "c2");
  }
  return CATEGORIES;
}

/* The template library (CATEGORIES + ROLE_EXTRA) is no longer auto-assigned.
   It's only used to generate "Recommended" suggestions that a manager or
   buddy can pick from. What a joiner actually sees/works on lives in
   profile.customTasks — that's the single source of truth for real tasks. */
/* Resolves a {en,de,sk} field to the current language (falls back to
   English, and passes plain strings through unchanged for backward compat). */
function tr(field){
  if(field == null) return "";
  if(typeof field === "string") return field;
  return field[currentLang] || field.en || "";
}

function getRecommendedTasks(profile){
  const list = [];
  getActiveCategories(profile).forEach(cat=>{
    cat.tasks.forEach((t,i)=>{
      list.push({
        key: cat.id+"_"+i, catId: cat.id, catTitle: tr(cat.title),
        day: t.day, text: tr(t.text).replace("{manager}", profile.manager), desc: tr(t.desc)
      });
    });
  });
  const roleExtra = ROLE_EXTRA[profile.position];
  if(roleExtra){
    list.push({
      key: "role_"+profile.position, catId: roleExtra.cat, catTitle: t("cat_role_specific"),
      day: roleExtra.day, text: tr(roleExtra.text).replace("{manager}", profile.manager),
      desc: tr(roleExtra.desc), role:true
    });
  }
  adminTemplates.forEach(at=>{
    const txt = at["text_"+currentLang] || at.text_en;
    const dsc = at["desc_"+currentLang] || at.desc_en || "";
    list.push({
      key: "admin_"+at.id, catId: "admin_"+at.id, catTitle: at.cat_title,
      day: at.day||1, text: txt, desc: dsc
    });
  });
  return list;
}

function buildTasks(profile){
  const assigned = profile.customTasks || profile.custom_tasks || [];
  return assigned.map(t=>({
    tid: t.id, catId: t.catId || "assigned", catTitle: t.catTitle || "Assigned tasks",
    day: t.day || 1, text: t.text, desc: t.desc || "", role: !!t.role, custom: t.source === "custom"
  }));
}

function dayNumber(startDateStr){
  const start = new Date(startDateStr+"T00:00:00");
  const now = new Date();
  const diff = Math.floor((now - start) / 86400000) + 1;
  return Math.max(1, diff);
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
function formatDate(iso){
  try{
    const d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  }catch(e){ return iso; }
}

function getAssignedGroups(){
  const groups = [];
  const seen = new Set();
  taskIndex.forEach(t=>{
    if(!seen.has(t.catId)){
      seen.add(t.catId);
      groups.push({ id: t.catId, title: t.catTitle || "Assigned tasks" });
    }
  });
  return groups;
}

function catStatus(catId){
  const tasks = taskIndex.filter(t=>t.catId===catId);
  if(!tasks.length) return "none";
  const done = tasks.filter(t=>state.tasks[t.tid]).length;
  if(done === tasks.length) return "done";
  if(done > 0) return "progress";
  const currentDay = dayNumber(state.startDate);
  const overdue = tasks.some(t=> !state.tasks[t.tid] && t.day < currentDay);
  return overdue ? "attention" : "none";
}

function renderStrip(){
  const row = document.getElementById("strip-row");
  row.innerHTML = "";
  const groups = getAssignedGroups();
  groups.forEach((cat, i)=>{
    const status = catStatus(cat.id);
    const el = document.createElement("div");
    el.className = "strip-op status-"+status;
    el.innerHTML = `<div class="dot"></div><div class="num mono">${String((i+1)*10).padStart(3,"0")}</div>`;
    el.addEventListener("click", ()=>{
      const card = document.getElementById("card-"+cat.id);
      if(card){ card.classList.remove("collapsed"); card.scrollIntoView({behavior:"smooth", block:"center"}); }
    });
    row.appendChild(el);
    if(i < groups.length-1){
      const line = document.createElement("div");
      line.className = "strip-line";
      row.appendChild(line);
    }
  });
}

function renderOpList(currentDay){
  const wrap = document.getElementById("op-list");
  wrap.innerHTML = "";
  const groups = getAssignedGroups();
  groups.forEach((cat, i)=>{
    const tasks = taskIndex.filter(t=>t.catId===cat.id);
    const doneCount = tasks.filter(t=>state.tasks[t.tid]).length;
    const status = catStatus(cat.id);
    const badgeClass = status==="done" ? "badge-done" : (status==="progress" || status==="attention") ? "badge-progress" : "badge-none";
    const badgeText = status==="done" ? t("op_completed") : (doneCount>0 ? t("op_inprocess") : t("op_notstarted"));

    const card = document.createElement("div");
    card.className = "op-card" + (status==="done" ? " collapsed" : "");
    card.id = "card-"+cat.id;
    const catLink = getCategoryLink(cat.id, tasks);
    card.innerHTML = `
      <div class="op-head">
        <div class="op-num mono">OP ${String((i+1)*10).padStart(3,"0")}</div>
        <div class="op-title">${escapeHtml(cat.title)}</div>
        ${catLink ? `<a class="cat-link-btn" href="${catLink.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${t("open_link")}</a>` : ""}
        <div class="op-count mono">${doneCount}/${tasks.length}</div>
        <div class="op-badge ${badgeClass}">${badgeText}</div>
        <div class="chev">▾</div>
      </div>
      <div class="op-body"></div>
    `;
    const body = card.querySelector(".op-body");
    tasks.forEach(t=>{
      const isDone = !!state.tasks[t.tid];
      const overdue = !isDone && t.day < currentDay;
      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = `
        <input type="checkbox" ${isDone ? "checked":""} data-tid="${t.tid}">
        <div class="task-main">
          <div class="task-text ${isDone?'done':''}">${escapeHtml(t.text)}</div>
          ${t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : ""}
          <div class="task-tags">
            <span class="tag-day ${overdue?'attention':''}">Day ${t.day}${overdue?' · due':''}</span>
            ${t.role ? `<span class="tag-role">Role-specific</span>` : ""}
            ${t.custom ? `<span class="tag-role">Added just for you</span>` : ""}
          </div>
          <textarea class="task-note" placeholder="Notes / comments" data-note-tid="${t.tid}">${escapeHtml(state.notes[t.tid]||"")}</textarea>
        </div>
      `;
      body.appendChild(row);
    });

    card.querySelector(".op-head").addEventListener("click", ()=>{
      card.classList.toggle("collapsed");
    });

    wrap.appendChild(card);
  });

  wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener("click", (e)=>e.stopPropagation());
    cb.addEventListener("change", async (e)=>{
      const tid = e.target.dataset.tid;
      state.tasks[tid] = e.target.checked;
      state.completedDates = state.completedDates || {};
      if(e.target.checked){ state.completedDates[tid] = new Date().toISOString(); }
      else{ delete state.completedDates[tid]; }
      await saveState();
      renderAll();
    });
  });
  wrap.querySelectorAll('textarea.task-note').forEach(ta=>{
    ta.addEventListener("click", e=>e.stopPropagation());
    ta.addEventListener("blur", async (e)=>{
      const tid = e.target.dataset.noteTid;
      state.notes[tid] = e.target.value;
      await saveState();
    });
  });
}

  const dashZone = document.getElementById("dashboard-zone");
  const sectionLabel = document.querySelector(".section-label");
  const mgrZone = document.getElementById("manager-zone");
  const buddyZone = document.getElementById("buddy-zone");
  const adminZone = document.getElementById("admin-zone");
  setupZone.style.display = currentRole === "joiner" ? "block" : "none";
  dashZone.style.display = currentRole === "joiner" ? "block" : "none";
  sectionLabel.style.display = (currentRole === "joiner" && state) ? "block" : "none";
  mgrZone.style.display = currentRole === "manager" ? "block" : "none";
  buddyZone.style.display = currentRole === "buddy" ? "block" : "none";
  adminZone.style.display = currentRole === "admin" ? "block" : "none";
  if(currentRole === "joiner") renderAll();
  if(currentRole === "manager") renderManagerZone();
  if(currentRole === "buddy") renderBuddyZone();
  if(currentRole === "admin") renderAdminZone();
}

async function loadManagerDirectory(){
  if(!cloudConfigured()) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/manager_directory?select=name&order=name.asc`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(!res.ok) return;
    const rows = await res.json();
    if(rows.length) managerDirectory = [...rows.map(r=>r.name), "Other"];
  }catch(e){ console.error("load manager directory failed", e); }
}
let adminView = { verified:false };

async function loadAdminTemplates(){
  if(!cloudConfigured()) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/custom_templates?select=*`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(res.ok) adminTemplates = await res.json();
  }catch(e){ console.error("load admin templates failed", e); }
}

const BUDDY_RECENTS_KEY = "buddy-recents";
async function loadBuddyRecents(){
  const v = await kvGet(BUDDY_RECENTS_KEY);
  try{ return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function saveBuddyRecent(profile){
  let list = await loadBuddyRecents();
  list = list.filter(r=>r.id !== profile.id);
  list.unshift({ id: profile.id, name: profile.name, position: profile.position, accessCode: profile.access_code });
  list = list.slice(0, 8);
  await kvSet(BUDDY_RECENTS_KEY, JSON.stringify(list));
  return list;
}
async function removeBuddyRecent(id){
  let list = await loadBuddyRecents();
  list = list.filter(r=>r.id !== id);
  await kvSet(BUDDY_RECENTS_KEY, JSON.stringify(list));
  return list;
}

async function renderBuddyRecentsList(){
  const wrap = document.getElementById("buddy-recents-wrap");
  if(!wrap) return;
  const list = await loadBuddyRecents();
  if(!list.length){ wrap.innerHTML = ""; return; }
  wrap.innerHTML = `
    <div class="mgr-section-label">${t("your_people")}</div>
    <div id="buddy-recents-list"></div>
  `;
  const listEl = document.createElement("div");
  document.getElementById("buddy-recents-list").replaceWith(listEl);
  listEl.id = "buddy-recents-list";
  list.forEach(r=>{
    const row = document.createElement("div");
    row.className = "buddy-recent-row";
    row.innerHTML = `
      <div class="buddy-recent-main">
        <div class="buddy-recent-name">${escapeHtml(r.name)}</div>
        <div class="buddy-recent-pos">${escapeHtml(r.position||"")}</div>
      </div>
      <button class="buddy-recent-open" data-id="${escapeHtml(r.id)}">${t("button_open_routing")}</button>
      <button class="buddy-recent-remove" data-id="${escapeHtml(r.id)}" title="Remove from this list">✕</button>
    `;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll(".buddy-recent-open").forEach(btn=>{
    btn.addEventListener("click", ()=>reopenBuddyProfile(btn.dataset.id));
  });
  listEl.querySelectorAll(".buddy-recent-remove").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      await removeBuddyRecent(btn.dataset.id);
      renderBuddyRecentsList();
    });
  });
}

async function reopenBuddyProfile(id){
  if(!cloudConfigured()) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles?select=*&id=eq.${encodeURIComponent(id)}`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = await res.json();
    if(!res.ok || !rows.length) return;
    buddyView = { verified:true, profile: rows[0] };
    renderBuddyZone();
  }catch(e){ console.error("reopen buddy profile failed", e); }
}

async function submitBuddyCode(){
  const code = document.getElementById("buddy-code-input").value.trim().toUpperCase();
  const errEl = document.getElementById("buddy-error");
  errEl.style.display = "none";
  if(!code) return;
  if(!cloudConfigured()){
    errEl.textContent = "Cloud sync isn't configured yet, so buddy access isn't available.";
    errEl.style.display = "block";
    return;
  }
  const submitBtn = document.getElementById("buddy-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Looking...";
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles?select=*&buddy_code=eq.${encodeURIComponent(code)}`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = await res.json();
    if(!res.ok || !rows.length){
      errEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = t("button_open_routing");
      return;
    }
    buddyView = { verified:true, profile: rows[0] };
    renderBuddyZone();
  }catch(e){
    errEl.textContent = "Something went wrong reaching the database. Try again.";
    errEl.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = t("button_open_routing");
  }
}

function renderAdminManagersList(){
  const wrap = document.getElementById("admin-managers-list");
  const names = managerDirectory.filter(m=>m!=="Other");
  if(!names.length){ wrap.innerHTML = `<div class="mgr-empty-note">No managers yet.</div>`; return; }
  wrap.innerHTML = names.map(name=>`
    <div class="template-row">
      <div style="flex:1;font-weight:600;font-size:12.5px;">${escapeHtml(name)}</div>
      <button class="mgr-remove-btn" data-name="${escapeHtml(name)}">${t("remove_view")}</button>
    </div>
  `).join("");
  wrap.querySelectorAll(".mgr-remove-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      btn.disabled = true;
      const ok = await removeManagerFromDirectory(btn.dataset.name);
      if(ok){
        managerDirectory = managerDirectory.filter(m=>m!==btn.dataset.name);
        renderAdminManagersList();
      } else {
        btn.disabled = false;
      }
    });
  });
}

async function submitNewManager(){
  const input = document.getElementById("admin-newmgr-name");
  const name = input.value.trim();
  if(!name) return;
  if(managerDirectory.includes(name)) { input.value = ""; return; }
  const btn = document.getElementById("admin-newmgr-submit");
  btn.disabled = true;
  const ok = await addManagerToDirectory(name);
  if(ok){
    managerDirectory = [...managerDirectory.filter(m=>m!=="Other"), name, "Other"];
    input.value = "";
    renderAdminManagersList();
  }
  btn.disabled = false;
}

async function addManagerToDirectory(name){
  if(!cloudConfigured()) return false;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/manager_directory`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Prefer":"return=minimal" },
      body: JSON.stringify({ name })
    });
    return res.ok;
  }catch(e){ console.error("add manager failed", e); return false; }
}
async function removeManagerFromDirectory(name){
  if(!cloudConfigured()) return false;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/manager_directory?name=eq.${encodeURIComponent(name)}`, {
      method: "DELETE",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    return res.ok;
  }catch(e){ console.error("remove manager failed", e); return false; }
}

    section.innerHTML = `<div class="mgr-error" style="display:block;">Cloud sync isn't configured yet.</div>`;
    return;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_admin?select=id&id=eq.admin`, {

async function submitAdminEnterPin(){
  const pin = document.getElementById("admin-pin-input").value.trim();
  const errEl = document.getElementById("admin-error");
  errEl.style.display = "none";
  if(!pin){ errEl.style.display = "block"; return; }
  try{
    const hash = await sha256Hex(pin);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_admin?select=pin_hash&id=eq.admin`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = await res.json();
    if(!res.ok || !rows.length || rows[0].pin_hash !== hash){ errEl.style.display = "block"; return; }
    adminView = { verified:true };
    renderAdminZone();
  }catch(e){ errEl.style.display = "block"; }
}
async function submitAdminSetPin(){
  const pin1 = document.getElementById("admin-pin-new").value.trim();
  const pin2 = document.getElementById("admin-pin-confirm").value.trim();
  const errEl = document.getElementById("admin-error");
  errEl.style.display = "none";
  if(!pin1 || pin1.length < 4 || pin1 !== pin2){ errEl.style.display = "block"; return; }
  try{
    const hash = await sha256Hex(pin1);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_admin`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Prefer":"return=minimal" },
      body: JSON.stringify({ id:"admin", pin_hash: hash })
    });
    if(!res.ok){ errEl.textContent = "Couldn't save PIN."; errEl.style.display = "block"; return; }
    adminView = { verified:true };
    renderAdminZone();
  }catch(e){ errEl.style.display = "block"; }
}

async function submitNewTemplate(){
  const catTitle = document.getElementById("admin-newtpl-cat").value.trim();
  const textEn = document.getElementById("admin-newtpl-text-en").value.trim();
  const textDe = document.getElementById("admin-newtpl-text-de").value.trim();
  const textSk = document.getElementById("admin-newtpl-text-sk").value.trim();
  const descEn = document.getElementById("admin-newtpl-desc-en").value.trim();
  const day = parseInt(document.getElementById("admin-newtpl-day").value, 10);
  if(!catTitle || !textEn) return;
  const newTpl = {
    id: genId("tpl"), cat_title: catTitle, text_en: textEn,
    text_de: textDe || null, text_sk: textSk || null, desc_en: descEn || null, day
  };
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/custom_templates`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Prefer":"return=minimal" },
      body: JSON.stringify(newTpl)
    });
    if(res.ok){
      adminTemplates.push(newTpl);
      renderAdminTemplatesList();
      document.getElementById("admin-newtpl-cat").value = "";
      document.getElementById("admin-newtpl-text-en").value = "";
      document.getElementById("admin-newtpl-text-de").value = "";
      document.getElementById("admin-newtpl-text-sk").value = "";
      document.getElementById("admin-newtpl-desc-en").value = "";
    }
  }catch(e){ console.error("add template failed", e); }
}

    });
