function renderMgrRows(){
  const rows = managerView.rows;
  const rowsWrap = document.getElementById("mgr-rows");
  if(!rows.length){
    rowsWrap.innerHTML = `<div class="locked-zone">No joiners found under your name yet.</div>`;
    return;
  }
  const search = (document.getElementById("mgr-search").value || "").toLowerCase();
  const sort = document.getElementById("mgr-sort").value;
  let list = rows.filter(p=> !search || (p.name||"").toLowerCase().includes(search));
  if(sort === "behind") list.sort((a,b)=>(a.pct||0)-(b.pct||0));
  else if(sort === "recent") list.sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at));
  else list.sort((a,b)=>(a.name||"").localeCompare(b.name||""));

  if(!list.length){
    rowsWrap.innerHTML = `<div class="locked-zone">No one matches that search.</div>`;
    return;
  }

  rowsWrap.innerHTML = list.map(p=>{
    const status = mgrRowStatus(p);
    const statusTxt = status==="done" ? t("status_done") : status==="behind" ? t("status_behind") : t("status_on_track");
    const d = dayNumber(p.start_date);
    return `
      <div class="mgr-row-wrap">
        <div class="mgr-row" data-id="${escapeHtml(p.id)}" style="cursor:pointer;">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">${escapeHtml(p.position)} · Day ${d} of ${p.target_days||10}</div>
          <div class="bar-wrap">
            <div class="bar-track"><div class="bar-fill" style="width:${p.pct||0}%"></div></div>
            <div class="pct-txt">${p.done_tasks||0}/${p.total_tasks||0} · ${p.pct||0}% · ${statusTxt}</div>
          </div>
          <div class="chev mgr-chev">▾</div>
        </div>
        <div class="mgr-detail" id="detail-${escapeHtml(p.id)}" style="display:none;"></div>
      </div>
    `;
  }).join("");

  rowsWrap.querySelectorAll(".mgr-row").forEach(rowEl=>{
    rowEl.addEventListener("click", ()=>{
      const id = rowEl.dataset.id;
      const detailEl = document.getElementById("detail-"+id);
      const isOpen = detailEl.style.display === "block";
      rowsWrap.querySelectorAll(".mgr-detail").forEach(d=>d.style.display="none");
      rowsWrap.querySelectorAll(".mgr-chev").forEach(c=>c.style.transform="");
      if(!isOpen){
        const profile = rows.find(r=>r.id===id);
        renderMgrDetail(detailEl, profile, { allowRemove:true, onChange: renderMgrRows, actorRole:"manager", actorName: managerView.name });
        detailEl.style.display = "block";
        rowEl.querySelector(".mgr-chev").style.transform = "rotate(180deg)";
      }
    });
  });
}

function renderTeamCompareChart(rows){
  if(!rows.length) return "";
  const sorted = [...rows].sort((a,b)=>(a.pct||0)-(b.pct||0));
  const barsHtml = sorted.map(p=>{
    const status = mgrRowStatus(p);
    const colorVar = status==="done" ? "var(--green)" : status==="behind" ? "var(--coral)" : "var(--cyan)";
    return `
      <div class="compare-row">
        <div class="compare-name">${escapeHtml(p.name)}</div>
        <div class="compare-track"><div class="compare-fill" style="width:${p.pct||0}%;background:${colorVar};"></div></div>
        <div class="compare-pct mono">${p.pct||0}%</div>
      </div>
    `;
  }).join("");
  return `
    <div class="mgr-chart-card">
      <div class="mgr-chart-title">Team progress · lowest first</div>
      ${barsHtml}
    </div>
  `;
}


function renderMgrDetail(container, p, opts){
  opts = opts || {};
  const allowRemove = opts.allowRemove !== false;
  const actorRole = opts.actorRole || "manager";
  const actorName = opts.actorName || "";
  const tasks = p.tasks || {};
  const notes = p.notes || {};
  const assigned = p.customTasks || p.custom_tasks || [];
  const id = cssEscape(p.id);

  // group assigned tasks by category for display
  const completedDates = p.completedDates || p.completed_dates || {};
  const assignedGroups = [];
  const seenCat = new Set();
  assigned.forEach(t=>{
    const catId = t.catId || "assigned";
    if(!seenCat.has(catId)){
      seenCat.add(catId);
      assignedGroups.push({ id: catId, title: t.catTitle || "Assigned" });
    }
  });
  const existingCatTitles = [...new Set(assigned.map(t=>t.catTitle).filter(Boolean))];

  const assignedBlocks = assignedGroups.map((cat, gi)=>{
    const catTasks = assigned.filter(t=>(t.catId||"assigned")===cat.id);
    const doneCount = catTasks.filter(t=>tasks[t.id]).length;
    const catKeySafe = cssEscape(cat.id) || ("acat"+gi);
    const rowsHtml = catTasks.map(t=>{
      const isDone = !!tasks[t.id];
      const note = notes[t.id];
      const completedAt = completedDates[t.id];
      const completedStr = completedAt ? new Date(completedAt).toLocaleDateString() : "";
      return `
        <div class="assigned-task-row">
          <span class="assigned-task-check">${isDone ? "✅" : "⬜"}</span>
          <div class="assigned-task-main">
            <div class="assigned-task-text ${isDone?'done':''}">${escapeHtml(t.text)}</div>
            ${t.desc ? `<div class="assigned-task-desc">${escapeHtml(t.desc)}</div>` : ""}
            ${note ? `<div class="assigned-task-note">"${escapeHtml(note)}"</div>` : ""}
            <div class="assigned-task-meta">
              <span class="tag-day">${t("day_word")} ${t.day||1}</span>
              ${isDone && completedStr ? `<span class="tag-done-date">✓ ${completedStr}</span>` : ""}
            </div>
          </div>
          <button class="assigned-task-delete" data-taskid="${escapeHtml(t.id)}" title="Remove this task">✕</button>
        </div>
      `;
    }).join("");
    return `
      <div class="assigned-cat-card" data-catkey="${catKeySafe}">
        <div class="assigned-cat-head">
          <span class="assigned-cat-title">${escapeHtml(cat.title)}</span>
          ${(()=>{ const lk = getCategoryLink(cat.id, catTasks); return lk ? `<a class="cat-link-btn" href="${lk.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${t("open_link")}</a>` : ""; })()}
          <span class="assigned-cat-count">${doneCount}/${catTasks.length}</span>
          <span class="assigned-cat-chev">▾</span>
        </div>
        <div class="assigned-cat-body">${rowsHtml}</div>
      </div>
    `;
  }).join("");

  // recommended = template library minus anything already assigned from a template
  const assignedTemplateKeys = new Set(assigned.filter(t=>t.templateKey).map(t=>t.templateKey));
  const recommended = getRecommendedTasks(p).filter(r=>!assignedTemplateKeys.has(r.key));
  const recGroups = [];
  const seenRecCat = new Set();
  recommended.forEach(r=>{
    if(!seenRecCat.has(r.catTitle)){
      seenRecCat.add(r.catTitle);
      recGroups.push(r.catTitle);
    }
  });
  // Put the role-specific recommendation first — it's the single most
  // relevant suggestion for this person's actual job, so it shouldn't
  // be buried under ten generic system-access categories.
  const roleLabel = t("cat_role_specific");
  recGroups.sort((a,b)=> (a===roleLabel ? -1 : b===roleLabel ? 1 : 0));

  const recommendedBlocks = recGroups.map((catTitle, gi)=>{
    const items = recommended.filter(r=>r.catTitle===catTitle);
    const isRole = catTitle === roleLabel;
    const catKey = cssEscape(catTitle) || ("cat"+gi);
    const itemsHtml = items.map(r=>`
      <div class="rec-task" data-search="${escapeHtml(r.text.toLowerCase())}">
        <div class="rec-task-main">
          <div class="rec-task-text">${escapeHtml(r.text)}</div>
          ${r.desc ? `<div class="rec-task-desc">${escapeHtml(r.desc)}</div>` : ""}
        </div>
        <select class="rec-task-day" data-key="${escapeHtml(r.key)}">
          ${Array.from({length:30},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===r.day?'selected':''}>${t("day_word")} ${d}</option>`).join("")}
        </select>
        <button class="rec-task-add" data-key="${escapeHtml(r.key)}">+ Add</button>
      </div>
    `).join("");
    return `
      <div class="rec-cat-card ${isRole ? 'rec-cat-featured' : ''}" data-catkey="${escapeHtml(catKey)}">
        <div class="rec-cat-head">
          ${isRole ? `<span class="rec-cat-star">★</span>` : ""}
          <span class="rec-cat-title">${escapeHtml(catTitle)}</span>
          ${(()=>{ const lk = getCategoryLink(items[0] && items[0].catId, []); return lk ? `<a class="cat-link-btn" href="${lk.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${t("open_link")}</a>` : ""; })()}
          <span class="rec-cat-count">${items.length}</span>
          <button class="rec-cat-addall" data-catkey="${escapeHtml(catKey)}">${t("add_all")}</button>
          <span class="rec-cat-chev">▾</span>
        </div>
        <div class="rec-cat-body" style="display:${isRole ? 'block' : 'none'};">${itemsHtml}</div>
      </div>
    `;
  }).join("");

  container.innerHTML = `
    <div class="mgr-detail-inner">
      <div class="mgr-target-days">
        <span class="mgr-target-label">${t("target_days_label")}</span>
        <select id="mgr-target-days-${id}">
          ${[5,7,10,15,20,30].map(n=>`<option value="${n}" ${n===(p.target_days||10)?'selected':''}>${n} ${t("day_word").toLowerCase()}s</option>`).join("")}
        </select>
        <span class="mgr-target-hint">${t("target_days_hint")}</span>
      </div>

      <div class="mgr-section-label">${t("section_assigned")} ${assigned.length ? `(${assigned.length})` : ""}</div>
      ${assigned.length ? assignedBlocks : `<div class="mgr-empty-note">${t("empty_assigned")}</div>`}

      <div class="mgr-section-label rec-label">${t("section_recommended")} ${recommended.length ? `(${recommended.length})` : ""}</div>
      ${recommended.length ? `
        <div class="rec-toolbar">
          <input type="text" class="rec-search" id="rec-search-${id}" placeholder="${t("search_recommended")}">
          <button class="rec-quickadd" id="rec-quickadd-${id}">${t("quick_add_all")}</button>
        </div>
      ` : ""}
      <div class="rec-wrap" id="rec-wrap-${id}">
        ${recommended.length ? recommendedBlocks : `<div class="mgr-empty-note">${t("empty_recommended")}</div>`}
      </div>

      <button class="mgr-add-task-btn" id="mgr-add-task-${id}">${t("add_own_task")}</button>
      <div class="mgr-add-task-form" id="mgr-add-task-form-${id}" style="display:none;">
        <input type="text" id="mgr-newtask-cat-${id}" placeholder="${t("task_category_ph")}" list="existing-cats-${id}">
        <datalist id="existing-cats-${id}">
          ${existingCatTitles.map(c=>`<option value="${escapeHtml(c)}">`).join("")}
        </datalist>
        <input type="text" id="mgr-newtask-text-${id}" placeholder="${t("task_name_ph")}">
        <textarea id="mgr-newtask-desc-${id}" placeholder="${t("task_desc_ph")}"></textarea>
        <input type="text" id="mgr-newtask-url-${id}" placeholder="${t("task_link_ph")}" style="margin-top:8px;">
        <div class="mgr-newtask-row">
          <select id="mgr-newtask-day-${id}">
            ${Array.from({length:30},(_,i)=>i+1).map(d=>`<option value="${d}">${t("day_word")} ${d}</option>`).join("")}
          </select>
          <button id="mgr-newtask-submit-${id}">${t("button_add_task")}</button>
        </div>
      </div>

      ${allowRemove ? `
        <button class="mgr-remove-btn" id="mgr-remove-${id}">${t("remove_view")}</button>
        <span class="mgr-remove-confirm" id="mgr-remove-confirm-${id}" style="display:none;">
          ${t("remove_confirm_prefix")} ${escapeHtml(p.name)} ${t("remove_confirm_suffix")}
          <button class="mgr-remove-yes" data-id="${escapeHtml(p.id)}">${t("remove_yes")}</button>
          <button class="mgr-remove-no">${t("remove_no")}</button>
        </span>
      ` : ""}
    </div>
  `;

  container.querySelector(`#mgr-target-days-${id}`).addEventListener("change", async (e)=>{
    const newDays = parseInt(e.target.value, 10);
    e.target.disabled = true;
    const ok = await updateTargetDaysInCloud(p.id, newDays);
    if(ok){
      p.target_days = newDays;
      const rowInList = managerView.rows && managerView.rows.find(r=>r.id===p.id);
      if(rowInList) rowInList.target_days = newDays;
      logAudit(p.id, p.name, actorRole, actorName, "target_days_changed", `${newDays} days`);
      if(opts.onChange) opts.onChange();
    }
    e.target.disabled = false;
  });

  container.querySelectorAll(".rec-task-add").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(taskOpBusy) return;
      taskOpBusy = true;
      const key = btn.dataset.key;
      const rec = recommended.find(r=>r.key===key);
      if(!rec) { taskOpBusy = false; return; }
      const daySelect = container.querySelector(`.rec-task-day[data-key="${CSS.escape(key)}"]`);
      const chosenDay = parseInt(daySelect.value, 10);
      const newTask = {
        id: genId("at"),
        templateKey: rec.key, catId: rec.catId, catTitle: rec.catTitle,
        text: rec.text, desc: rec.desc, day: chosenDay, source:"template", role: !!rec.role
      };
      btn.disabled = true;
      btn.textContent = "Adding...";
      const ok = await addCustomTaskToCloud(p.id, newTask);
      taskOpBusy = false;
      if(ok){
        p.customTasks = [...(p.customTasks||p.custom_tasks||[]), newTask];
        p.custom_tasks = p.customTasks;
        const rowInList = managerView.rows && managerView.rows.find(r=>r.id===p.id);
        if(rowInList){ rowInList.custom_tasks = p.customTasks; rowInList.customTasks = p.customTasks; }
        logAudit(p.id, p.name, actorRole, actorName, "task_added", rec.text);
        renderMgrDetail(container, p, opts);
      } else {
        btn.disabled = false;
        btn.textContent = "+ Add";
      }
    });
  });

  // Collapsible category headers (click anywhere on the header, except the "Add all" button)
  container.querySelectorAll(".rec-cat-head").forEach(head=>{
    head.addEventListener("click", (e)=>{
      if(e.target.closest(".rec-cat-addall")) return;
      const body = head.parentElement.querySelector(".rec-cat-body");
      const chev = head.querySelector(".rec-cat-chev");
      const open = body.style.display !== "none";
      body.style.display = open ? "none" : "block";
      if(chev) chev.style.transform = open ? "" : "rotate(180deg)";
    });
  });

  // "+ Add all" per category — bulk-assigns every item in that category at once
  container.querySelectorAll(".rec-cat-addall").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(taskOpBusy) return;
      taskOpBusy = true;
      const catKey = btn.dataset.catkey;
      const card = container.querySelector(`.rec-cat-card[data-catkey="${CSS.escape(catKey)}"]`);
      const daySelects = card.querySelectorAll(".rec-task-day");
      const keysInCat = Array.from(daySelects).map(s=>s.dataset.key);
      const items = keysInCat.map(k=>{
        const rec = recommended.find(r=>r.key===k);
        const sel = card.querySelector(`.rec-task-day[data-key="${CSS.escape(k)}"]`);
        return { rec, day: parseInt(sel.value,10) };
      }).filter(x=>x.rec);
      if(!items.length) { taskOpBusy = false; return; }
      btn.disabled = true;
      btn.textContent = "…";
      const newTasks = items.map(({rec,day})=>({
        id: genId("at"), templateKey: rec.key, catId: rec.catId, catTitle: rec.catTitle,
        text: rec.text, desc: rec.desc, day, source:"template", role: !!rec.role
      }));
      const ok = await addMultipleTasksToCloud(p.id, newTasks);
      taskOpBusy = false;
      if(ok){
        p.customTasks = [...(p.customTasks||p.custom_tasks||[]), ...newTasks];
        p.custom_tasks = p.customTasks;
        const rowInList = managerView.rows && managerView.rows.find(r=>r.id===p.id);
        if(rowInList){ rowInList.custom_tasks = p.customTasks; rowInList.customTasks = p.customTasks; }
        logAudit(p.id, p.name, actorRole, actorName, "tasks_bulk_added", `${newTasks.length} tasks (${newTasks[0].catTitle})`);
        renderMgrDetail(container, p, opts);
      } else {
        btn.disabled = false;
        btn.textContent = t("add_all");
      }
    });
  });

  // Quick-add everything still recommended, across all categories
  const quickAddBtn = container.querySelector(`#rec-quickadd-${id}`);
  if(quickAddBtn){
    quickAddBtn.addEventListener("click", async ()=>{
      if(taskOpBusy) return;
      taskOpBusy = true;
      quickAddBtn.disabled = true;
      quickAddBtn.textContent = "…";
      const newTasks = recommended.map(rec=>({
        id: genId("at"), templateKey: rec.key, catId: rec.catId, catTitle: rec.catTitle,
        text: rec.text, desc: rec.desc, day: rec.day, source:"template", role: !!rec.role
      }));
      const ok = await addMultipleTasksToCloud(p.id, newTasks);
      taskOpBusy = false;
      if(ok){
        p.customTasks = [...(p.customTasks||p.custom_tasks||[]), ...newTasks];
        p.custom_tasks = p.customTasks;
        const rowInList = managerView.rows && managerView.rows.find(r=>r.id===p.id);
        if(rowInList){ rowInList.custom_tasks = p.customTasks; rowInList.customTasks = p.customTasks; }
        logAudit(p.id, p.name, actorRole, actorName, "tasks_bulk_added", `${newTasks.length} tasks (all recommended)`);
        renderMgrDetail(container, p, opts);
      } else {
        quickAddBtn.disabled = false;
        quickAddBtn.textContent = t("quick_add_all");
      }
    });
  }

  // Live search across recommended items — filters items and auto-expands
  // matching categories, hides categories with zero matches.
  const searchInput = container.querySelector(`#rec-search-${id}`);
  if(searchInput){
    searchInput.addEventListener("input", ()=>{
      const q = searchInput.value.trim().toLowerCase();
      container.querySelectorAll(".rec-cat-card").forEach(card=>{
        const items = card.querySelectorAll(".rec-task");
        let anyMatch = false;
        items.forEach(item=>{
          const match = !q || item.dataset.search.includes(q);
          item.style.display = match ? "flex" : "none";
          if(match) anyMatch = true;
        });
        card.style.display = anyMatch ? "block" : "none";
        const body = card.querySelector(".rec-cat-body");
        if(q && anyMatch) body.style.display = "block";
      });
    });
  }

  const addBtn = container.querySelector(`#mgr-add-task-${id}`);
  const addForm = container.querySelector(`#mgr-add-task-form-${id}`);
  addBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    addForm.style.display = addForm.style.display === "none" ? "block" : "none";
  });
  container.querySelector(`#mgr-newtask-submit-${id}`).addEventListener("click", async (e)=>{
    e.stopPropagation();
    if(taskOpBusy) return;
    const catInput = container.querySelector(`#mgr-newtask-cat-${id}`);
    const textInput = container.querySelector(`#mgr-newtask-text-${id}`);
    const descInput = container.querySelector(`#mgr-newtask-desc-${id}`);
    const urlInput = container.querySelector(`#mgr-newtask-url-${id}`);
    const dayInput = container.querySelector(`#mgr-newtask-day-${id}`);
    const text = textInput.value.trim();
    if(!text) { textInput.focus(); return; }
    taskOpBusy = true;
    const catTitle = catInput.value.trim() || t("task_category_default");
    const urlVal = urlInput.value.trim();
    const newTask = {
      id: genId("ct"),
      catId: "custom_"+cssEscape(catTitle).toLowerCase(), catTitle,
      text, desc: descInput.value.trim(), day: parseInt(dayInput.value, 10), source:"custom",
      url: urlVal || undefined
    };
    const submitBtn = container.querySelector(`#mgr-newtask-submit-${id}`);
    submitBtn.disabled = true;
    submitBtn.textContent = "Adding...";
    const ok = await addCustomTaskToCloud(p.id, newTask);
    taskOpBusy = false;
    if(ok){
      p.customTasks = [...(p.customTasks||p.custom_tasks||[]), newTask];
      p.custom_tasks = p.customTasks;
      const rowInList = managerView.rows && managerView.rows.find(r=>r.id===p.id);
      if(rowInList){ rowInList.custom_tasks = p.customTasks; rowInList.customTasks = p.customTasks; }
      logAudit(p.id, p.name, actorRole, actorName, "custom_task_added", text);
      renderMgrDetail(container, p, opts);
    } else {
      submitBtn.disabled = false;
      submitBtn.textContent = t("button_add_task");
    }
  });

  if(allowRemove){
    const removeBtn = container.querySelector(`#mgr-remove-${id}`);
    const confirmEl = container.querySelector(`#mgr-remove-confirm-${id}`);
    removeBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      removeBtn.style.display = "none";
      confirmEl.style.display = "inline";
    });
    confirmEl.querySelector(".mgr-remove-no").addEventListener("click", (e)=>{
      e.stopPropagation();
      confirmEl.style.display = "none";
      removeBtn.style.display = "inline-block";
    });
    confirmEl.querySelector(".mgr-remove-yes").addEventListener("click", async (e)=>{
      e.stopPropagation();
      await removeProfileFromCloud(p.id);
      logAudit(p.id, p.name, actorRole, actorName, "profile_removed_from_view", "");
      managerView.rows = managerView.rows.filter(r=>r.id!==p.id);
      renderManagerZone();
    });
  }

  // Collapsible assigned-task category cards (default open, click header to toggle)
  container.querySelectorAll(".assigned-cat-head").forEach(head=>{
    head.addEventListener("click", ()=>{
      const body = head.parentElement.querySelector(".assigned-cat-body");
      const chev = head.querySelector(".assigned-cat-chev");
      const open = body.style.display !== "none";
      body.style.display = open ? "none" : "block";
      if(chev) chev.style.transform = open ? "rotate(-90deg)" : "";
    });
  });

  // Remove a single assigned task (with inline confirm, no browser dialog)
  container.querySelectorAll(".assigned-task-delete").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(btn.dataset.confirming !== "1"){
        btn.dataset.confirming = "1";
        btn.textContent = "✓?";
        btn.title = "Click again to confirm removal";
        setTimeout(()=>{ if(btn.dataset.confirming==="1"){ btn.dataset.confirming="0"; btn.textContent="✕"; btn.title="Remove this task"; } }, 3000);
        return;
      }
      const taskId = btn.dataset.taskid;
      if(taskOpBusy) return;
      taskOpBusy = true;
      const removedTask = assigned.find(x=>x.id===taskId);
      btn.disabled = true;
      const ok = await deleteAssignedTaskFromCloud(p.id, taskId);
      taskOpBusy = false;
      if(ok){
        p.customTasks = assigned.filter(x=>x.id!==taskId);
        p.custom_tasks = p.customTasks;
        const rowInList = managerView.rows && managerView.rows.find(r=>r.id===p.id);
        if(rowInList){ rowInList.custom_tasks = p.customTasks; rowInList.customTasks = p.customTasks; }
        logAudit(p.id, p.name, actorRole, actorName, "task_removed", removedTask ? removedTask.text : taskId);
        renderMgrDetail(container, p, opts);
        if(opts.onChange) opts.onChange();
      } else {
        btn.disabled = false;
      }
    });
  });
}

async function deleteAssignedTaskFromCloud(profileId, taskId){
  if(!cloudConfigured()) return false;
  try{
    const getRes = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles?select=custom_tasks&id=eq.${encodeURIComponent(profileId)}`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(!getRes.ok) return false;
    const rows = await getRes.json();
    const current = (rows[0] && rows[0].custom_tasks) || [];
    const updated = current.filter(x=>x.id!==taskId);
    const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles?id=eq.${encodeURIComponent(profileId)}`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ custom_tasks: updated })
    });
    return patchRes.ok;
  }catch(e){ console.error("delete task failed", e); return false; }
}

function renderJoinsChart(rows){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: d.getFullYear()+"-"+d.getMonth(), label: d.toLocaleDateString("en-GB",{month:"short"}), count:0 });
  }
  rows.forEach(r=>{
    if(!r.start_date) return;
    const d = new Date(r.start_date+"T00:00:00");
    const key = d.getFullYear()+"-"+d.getMonth();
    const m = months.find(m=>m.key===key);
    if(m) m.count++;
  });
  const max = Math.max(1, ...months.map(m=>m.count));
  const bars = months.map(m=>{
    const heightPct = m.count ? Math.max(8, Math.round((m.count/max)*100)) : 3;
    return `
      <div class="mgr-chart-col">
        <div class="mgr-chart-count">${m.count || ""}</div>
        <div class="mgr-chart-bar" style="height:${heightPct}%"></div>
        <div class="mgr-chart-label">${m.label}</div>
      </div>
    `;
  }).join("");
  return `
    <div class="mgr-chart-card">
      <div class="mgr-chart-title">New joiners started · last 6 months</div>
      <div class="mgr-chart-bars">${bars}</div>
    </div>
  `;
}

function mgrRowStatus(p){
  if(p.pct >= 100) return "done";
  const d = dayNumber(p.start_date);
  const target = p.target_days || 10;
  const expected = Math.min(100, Math.round((d/target)*100));
  return (expected - p.pct >= 20) ? "behind" : "ontrack";
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function submitEnterPin(name){
  const pin = document.getElementById("mgr-pin-input").value.trim();
  const errEl = document.getElementById("mgr-error");
  errEl.style.display = "none";
  if(!pin){ errEl.style.display = "block"; return; }
  try{
    const hash = await sha256Hex(pin);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/managers?select=pin_hash&name=eq.${encodeURIComponent(name)}`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = await res.json();
    if(!res.ok || !rows.length || rows[0].pin_hash !== hash){
      errEl.style.display = "block";
      return;
    }
    await loadManagerTeam(name, pin);
  }catch(e){
    errEl.textContent = "Something went wrong. Try again.";
    errEl.style.display = "block";
  }
}

async function submitSetPin(name){
  const pin1 = document.getElementById("mgr-pin-new").value.trim();
  const pin2 = document.getElementById("mgr-pin-confirm").value.trim();
  const errEl = document.getElementById("mgr-error");
  errEl.style.display = "none";
  if(!pin1 || pin1.length < 4 || pin1 !== pin2){
    errEl.style.display = "block";
    return;
  }
  try{
    const hash = await sha256Hex(pin1);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/managers`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ name, pin_hash: hash })
    });
    if(!res.ok){
      errEl.textContent = "Couldn't save your PIN. Try again.";
      errEl.style.display = "block";
      return;
    }
    await loadManagerTeam(name, pin1);
  }catch(e){
    errEl.textContent = "Something went wrong. Try again.";
    errEl.style.display = "block";
  }
}

async function loadManagerTeam(name, pin){
  try{
    const teamRes = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles?select=*&manager=eq.${encodeURIComponent(name)}&order=updated_at.desc`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const teamData = await teamRes.json();
    managerView = { verified:true, name, rows: teamData || [], pin: pin || "" };

  }catch(e){
    const errEl = document.getElementById("mgr-error");
    if(errEl){ errEl.textContent = "Something went wrong reaching the database. Try again."; errEl.style.display = "block"; }
  }
}

function initMenu(){
  const trigger = document.getElementById("menu-trigger");
  const dropdown = document.getElementById("menu-dropdown");
  trigger.addEventListener("click", (e)=>{
    e.stopPropagation();
    dropdown.classList.toggle("open");
  });
  document.addEventListener("click", (e)=>{
    if(!dropdown.contains(e.target) && e.target !== trigger){
      dropdown.classList.remove("open");
    }
  });
  document.querySelectorAll("#theme-toggle button").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const t = btn.dataset.theme;
      applyTheme(t);
      await saveTheme(t);
    });
  });
  document.querySelectorAll("#lang-toggle button").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const l = btn.dataset.lang;
      applyLang(l);
      await saveLang(l);
    });

    dropdown.classList.remove("open");

  });
  document.getElementById("copy-status-btn").addEventListener("click", async ()=>{
    if(!state) return;
    const currentDay = dayNumber(state.startDate);
    const idx = buildTasks(state);
    const total = idx.length;
    const done = idx.filter(t=>state.tasks[t.tid]).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const inProgress = getActiveCategories().filter(c=>catStatus(c.id)==="progress" || catStatus(c.id)==="attention").map(c=>tr(c.title));
    const text = `${state.name} — ${state.position}, Day ${currentDay} of onboarding routing.\n${pct}% confirmed (${done}/${total} operations).\nIn progress: ${inProgress.length ? inProgress.join(", ") : "—"}.`;
    try{
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById("copy-status-btn");
      const original = btn.textContent;
      btn.textContent = "✓ Copied to clipboard";
      setTimeout(()=>{ btn.textContent = original; }, 1800);
    }catch(e){
      alert(text);
    }
  });
}

async function mergeCustomTasksFromCloud(){
  if(!cloudConfigured() || !state || !state.id) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/onboarding_profiles?select=custom_tasks,target_days&id=eq.${encodeURIComponent(state.id)}`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(!res.ok) return;
    const rows = await res.json();
    if(!rows.length) return;
    const cloudCustom = rows[0].custom_tasks || [];
    let changed = false;
    // Cloud is the source of truth for which tasks are assigned — a manager
    // or buddy can add or remove tasks remotely, so fully replace (not just
    // union) to reflect both additions and removals.
    const localIds = (state.customTasks||[]).map(t=>t.id).sort().join(",");
    const cloudIds = cloudCustom.map(t=>t.id).sort().join(",");
    if(localIds !== cloudIds){
      state.customTasks = cloudCustom;
      changed = true;
    }
    if(rows[0].target_days && rows[0].target_days !== state.targetDays){
      state.targetDays = rows[0].target_days;
      changed = true;
    }
    if(changed) await kvSet(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error("merge from cloud failed", e); }
}

  await loadAdminTemplates();
  await loadManagerDirectory();
  await mergeCustomTasksFromCloud();
  renderAll();
  updateCopyStatusVisibility();
  const loader = document.getElementById("page-loader");
  if(loader){ loader.classList.add("hidden"); setTimeout(()=>loader.remove(), 300); }
})();
